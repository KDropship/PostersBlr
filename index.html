<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTERSBLR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(255,0,150,.15),transparent 30%),
    radial-gradient(circle at bottom right,rgba(0,200,255,.12),transparent 30%),
    #08080c;
  color:#fff;
  min-height:100vh;
}

header{
  padding:25px 20px;
  text-align:center;
  background:linear-gradient(135deg,#11111a,#17172a);
  border-bottom:1px solid rgba(255,255,255,.08);
  box-shadow:0 0 30px rgba(130,80,255,.12);
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  margin-top:7px;
  color:#aaa;
  font-size:14px;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

nav button{
  background:#15151f;
  border:1px solid #29293a;
  color:#fff;
  padding:9px 16px;
  border-radius:20px;
  cursor:pointer;
  transition:.2s;
}

nav button:hover,
nav button.active{
  background:linear-gradient(90deg,#ff3cac,#784ba0);
  border-color:transparent;
}

.cart-btn{
  margin-top:15px;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
  border:none;
  color:white;
  padding:10px 20px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
}

.products{
  max-width:1100px;
  margin:35px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:rgba(22,22,31,.9);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:12px;
  overflow:hidden;
  transition:.25s;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 40px rgba(120,75,160,.22);
}

.poster{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  display:block;
}

.card h3{
  font-size:17px;
  margin:12px 2px 5px;
}

.price{
  color:#00d4ff;
  font-weight:bold;
  margin:4px 2px 10px;
}

.card-buttons{
  display:flex;
  gap:7px;
}

.card button{
  flex:1;
  border:none;
  padding:10px 5px;
  border-radius:9px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.preview-btn{
  background:#29293a;
}

.buy-btn{
  background:linear-gradient(90deg,#ff3cac,#784ba0);
}

.cart-add{
  background:linear-gradient(90deg,#00c6ff,#0072ff);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:1300;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-content{
  position:relative;
  max-width:95vw;
  max-height:95vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal img{
  width:min(92vw,520px);
  height:min(78vh,700px);
  aspect-ratio:3/4;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 0 40px rgba(255,255,255,.15);
}

.close{
  position:absolute;
  top:-15px;
  right:-15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:#fff;
  color:#000;
  font-size:22px;
  cursor:pointer;
  z-index:2;
}

.form-modal{
  background:#12121a;
  width:min(94vw,450px);
  border:1px solid #2b2b3d;
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.form-modal h2{
  margin-bottom:16px;
  font-size:23px;
}

.form-modal input,
.form-modal textarea{
  width:100%;
  margin-bottom:11px;
  padding:12px;
  border-radius:9px;
  border:1px solid #303042;
  background:#0c0c12;
  color:#fff;
  outline:none;
}

.form-modal textarea{
  resize:none;
  min-height:80px;
}

.form-modal button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#25d366,#128c7e);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.cart-panel{
  position:fixed;
  right:-100%;
  top:0;
  width:min(90vw,400px);
  height:100vh;
  background:#111119;
  z-index:1200;
  padding:22px;
  transition:.3s;
  box-shadow:-15px 0 50px rgba(0,0,0,.5);
  overflow-y:auto;
}

.cart-panel.open{
  right:0;
}

.cart-panel h2{
  margin-bottom:18px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #292936;
}

.cart-item img{
  width:60px;
  height:80px;
  object-fit:cover;
  border-radius:7px;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  font-size:14px;
  margin-bottom:5px;
}

.cart-item-info p{
  color:#00d4ff;
  font-size:13px;
}

.remove-btn{
  background:#29293a;
  color:#fff;
  border:none;
  padding:5px 8px;
  border-radius:6px;
  cursor:pointer;
  height:max-content;
}

.cart-total{
  margin-top:20px;
  font-size:18px;
  font-weight:bold;
}

.cart-order{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#25d366,#128c7e);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.empty-cart{
  color:#999;
  text-align:center;
  margin-top:40px;
}

@media(max-width:700px){
  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    padding:0 12px;
    margin-top:25px;
  }

  .card{
    padding:8px;
    border-radius:13px;
  }

  .card h3{
    font-size:13px;
    margin-top:8px;
  }

  .price{
    font-size:13px;
    margin-bottom:7px;
  }

  .card-buttons{
    flex-direction:column;
    gap:5px;
  }

  .card button{
    padding:8px 4px;
    font-size:11px;
  }

  .logo{
    font-size:27px;
  }

  .modal{
    padding:10px;
  }

  .modal img{
    width:92vw;
    height:82vh;
    max-height:82vh;
  }

  .close{
    top:-5px;
    right:-5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">POSTERSBLR</div>
  <div class="tagline">Make your walls say something.</div>

  <nav>
    <button class="active" onclick="filterProducts('all',this)">All</button>
    <button onclick="filterProducts('travel',this)">Travel</button>
    <button onclick="filterProducts('motivation',this)">Motivation</button>
    <button onclick="filterProducts('gym',this)">Gym Motivation</button>
  </nav>

  <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<section class="products">

  <!-- TRAVEL -->
  <div class="card" data-category="travel" data-name="Chase The Horizon" data-price="29" data-image="travel1.jpg">
    <img src="travel1.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Chase The Horizon</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <div class="card" data-category="travel" data-name="Find Your Way" data-price="29" data-image="travel2.jpg">
    <img src="travel2.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Find Your Way</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <div class="card" data-category="travel" data-name="Go Somewhere" data-price="29" data-image="travel3.jpg">
    <img src="travel3.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Go Somewhere</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <!-- MOTIVATION -->
  <div class="card" data-category="motivation" data-name="Stay Relentless" data-price="29" data-image="motivation1.jpg">
    <img src="motivation1.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Stay Relentless</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <div class="card" data-category="motivation" data-name="No Excuses" data-price="29" data-image="motivation2.jpg">
    <img src="motivation2.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>No Excuses</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <div class="card" data-category="motivation" data-name="Keep Going" data-price="29" data-image="motivation3.jpg">
    <img src="motivation3.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Keep Going</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <!-- GYM MOTIVATION -->
  <div class="card" data-category="gym" data-name="Earn Your Strength" data-price="29" data-image="gym1.jpg">
    <img src="gym1.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Earn Your Strength</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <div class="card" data-category="gym" data-name="Built Not Born" data-price="29" data-image="gym2.jpg">
    <img src="gym2.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>Built Not Born</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

  <div class="card" data-category="gym" data-name="One More Rep" data-price="29" data-image="gym3.jpg">
    <img src="gym3.jpg" class="poster" onclick="previewPoster(this.src)">
    <h3>One More Rep</h3>
    <div class="price">₹29</div>
    <div class="card-buttons">
      <button class="preview-btn" onclick="previewPoster(this.closest('.card').querySelector('.poster').src)">Preview</button>
      <button class="cart-add" onclick="addOnlyToCart(this.closest('.card'))">Add to Cart</button>
      <button class="buy-btn" onclick="buyNow(this.closest('.card'))">Buy Now</button>
    </div>
  </div>

</section>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal" onclick="closePreview(event)">
  <div class="modal-content">
    <button class="close" onclick="closePreview()">×</button>
    <img id="previewImage" src="" alt="Poster Preview">
  </div>
</div>

<!-- ORDER MODAL -->
<div class="modal" id="orderModal">
  <div class="form-modal">
    <button class="close" onclick="closeOrder()">×</button>
    <h2>Order Poster</h2>

    <input type="text" id="customerName" placeholder="Your Name">
    <input type="text" id="customerPhone" placeholder="Phone Number">
    <textarea id="customerAddress" placeholder="Delivery Address"></textarea>

    <button onclick="sendOrder()">Order on WhatsApp</button>
  </div>
</div>

<!-- CART -->
<div class="cart-panel" id="cartPanel">
  <button class="close" onclick="toggleCart()">×</button>
  <h2>Your Cart 🛒</h2>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total: ₹<span id="cartTotal">0</span>
  </div>

  <button class="cart-order" onclick="orderCart()">Order Cart on WhatsApp</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("postersblr_cart")) || [];
let currentProduct = null;

function saveCart(){
  localStorage.setItem("postersblr_cart",JSON.stringify(cart));
  updateCart();
}

function updateCart(){
  document.getElementById("cartCount").textContent=cart.length;

  const items=document.getElementById("cartItems");
  const total=document.getElementById("cartTotal");

  if(cart.length===0){
    items.innerHTML='<div class="empty-cart">Your cart is empty.</div>';
    total.textContent="0";
    return;
  }

  let sum=0;

  items.innerHTML=cart.map((item,index)=>{
    sum+=Number(item.price);

    return `
      <div class="cart-item">
        <img src="${item.image}" alt="">
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <p>₹${item.price}</p>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
      </div>
    `;
  }).join("");

  total.textContent=sum;
}

function addToCart(card){
  cart.push({
    name:card.dataset.name,
    price:Number(card.dataset.price),
    image:card.dataset.image
  });

  saveCart();
}

function addOnlyToCart(card){
  addToCart(card);
}

function removeFromCart(index){
  cart.splice(index,1);
  saveCart();
}

function toggleCart(){
  document.getElementById("cartPanel").classList.toggle("open");
}

function previewPoster(src){
  document.getElementById("previewImage").src=src;
  document.getElementById("previewModal").style.display="flex";
}

function closePreview(event){
  if(!event || event.target.id==="previewModal"){
    document.getElementById("previewModal").style.display="none";
  }
}
    function filterProducts(category,button){
  document.querySelectorAll("nav button").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  document.querySelectorAll(".card").forEach(card=>{
    if(category==="all" || card.dataset.category===category){
      card.style.display="block";
    }else{
      card.style.display="none";
    }
  });
}

function buyNow(card){
  currentProduct={
    name:card.dataset.name,
    price:Number(card.dataset.price),
    image:card.dataset.image
  };

  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("customerAddress").value="";

  document.getElementById("orderModal").style.display="flex";
}

function closeOrder(){
  document.getElementById("orderModal").style.display="none";
}

function sendOrder(){
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){
    alert("Please fill in all details.");
    return;
  }

  const message=
`Hello PostersBlr! 👋

I want to order:

Poster: ${currentProduct.name}
Price: ₹${currentProduct.price}

Name: ${name}
Phone: ${phone}
Address: ${address}`;

  const whatsappURL=
    "https://wa.me/916366788554?text="+encodeURIComponent(message);

  window.open(whatsappURL,"_blank");
}

function orderCart(){
  if(cart.length===0){
    alert("Your cart is empty.");
    return;
  }

  // Close the cart first
  document.getElementById("cartPanel").classList.remove("open");

  // Then open the order form
  document.getElementById("orderModal").style.display="flex";

  currentProduct=null;
}
document.getElementById("orderModal").addEventListener("click",function(e){
  if(e.target===this){
    closeOrder();
  }
});

function sendOrder(){
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){
    alert("Please fill in all details.");
    return;
  }

  let message="Hello PostersBlr! 👋\n\nI want to order:\n\n";

  if(currentProduct){
    message+=
      `Poster: ${currentProduct.name}\n`+
      `Price: ₹${currentProduct.price}\n`;
  }else{
    cart.forEach((item,index)=>{
      message+=
        `${index+1}. ${item.name} - ₹${item.price}\n`;
    });

    const total=cart.reduce((sum,item)=>sum+Number(item.price),0);
    message+=`\nTotal: ₹${total}\n`;
  }

  message+=
    `\nName: ${name}`+
    `\nPhone: ${phone}`+
    `\nAddress: ${address}`;

  const whatsappURL=
    "https://wa.me/916366788554?text="+encodeURIComponent(message);

  window.open(whatsappURL,"_blank");
}

updateCart();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTERSBLR</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,0,170,.18),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(0,180,255,.16),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(130,50,255,.12),transparent 35%),
    #07070b;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* subtle background pattern */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}

/* HEADER */
header{
  position:relative;
  padding:32px 20px 28px;
  text-align:center;
  background:
    linear-gradient(180deg,rgba(20,20,30,.96),rgba(10,10,15,.88));
  border-bottom:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 10px 50px rgba(0,0,0,.35),
    0 0 60px rgba(150,60,255,.08);
  backdrop-filter:blur(18px);
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(
    90deg,
    #ff38b8,
    #a855f7,
    #4f8cff,
    #00d9ff
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(190,70,255,.25));
}

.tagline{
  margin-top:9px;
  color:#8f8f9d;
  font-size:14px;
  letter-spacing:.5px;
}

/* CATEGORY NAV */
nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:23px;
}

nav button{
  position:relative;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.10);
  color:#bcbcca;
  padding:10px 18px;
  border-radius:25px;
  cursor:pointer;
  transition:.25s ease;
  backdrop-filter:blur(10px);
  font-weight:600;
}

nav button:hover{
  color:#fff;
  border-color:rgba(200,90,255,.55);
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(170,60,255,.16);
}

nav button.active{
  color:#fff;
  background:linear-gradient(
    135deg,
    #ff299f,
    #a43cff,
    #526cff
  );
  border-color:transparent;
  box-shadow:
    0 6px 25px rgba(190,50,255,.25),
    inset 0 1px rgba(255,255,255,.25);
}

/* CART BUTTON */
.cart-btn{
  margin-top:18px;
  background:linear-gradient(
    135deg,
    #00d4ff,
    #4772ff
  );
  border:1px solid rgba(255,255,255,.18);
  color:white;
  padding:11px 22px;
  border-radius:25px;
  font-weight:800;
  cursor:pointer;
  box-shadow:
    0 8px 25px rgba(0,140,255,.18),
    inset 0 1px rgba(255,255,255,.25);
  transition:.25s ease;
}

.cart-btn:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:
    0 12px 32px rgba(0,140,255,.28),
    0 0 25px rgba(0,200,255,.12);
}

/* PRODUCTS */
.products{
  max-width:1100px;
  margin:42px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

/* PRODUCT CARD */
.card{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(30,30,43,.92),
      rgba(15,15,23,.94)
    );
  border:1px solid rgba(255,255,255,.085);
  border-radius:20px;
  padding:12px;
  overflow:hidden;
  transition:
    transform .3s ease,
    box-shadow .3s ease,
    border-color .3s ease;
  box-shadow:
    0 12px 40px rgba(0,0,0,.28);
}

.card::before{
  content:"";
  position:absolute;
  width:140px;
  height:140px;
  top:-90px;
  right:-70px;
  border-radius:50%;
  background:rgba(170,60,255,.15);
  filter:blur(35px);
  pointer-events:none;
}

.card:hover{
  transform:translateY(-7px);
  border-color:rgba(190,80,255,.28);
  box-shadow:
    0 18px 50px rgba(0,0,0,.4),
    0 0 30px rgba(150,60,255,.10);
}

/* POSTER */
.poster{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
  display:block;
  transition:
    transform .35s ease,
    filter .35s ease;
  box-shadow:
    0 8px 25px rgba(0,0,0,.3);
}

.card:hover .poster{
  transform:scale(1.015);
  filter:brightness(1.04);
}

/* PRODUCT TEXT */
.card h3{
  font-size:17px;
  margin:14px 2px 5px;
  font-weight:750;
  letter-spacing:.1px;
}

.price{
  color:#35dcff;
  font-weight:800;
  margin:5px 2px 11px;
  font-size:15px;
}

/* BUTTONS */
.card-buttons{
  display:flex;
  gap:7px;
}

.card button{
  flex:1;
  border:none;
  padding:10px 5px;
  border-radius:10px;
  color:#fff;
  font-weight:750;
  cursor:pointer;
  font-size:13px;
  transition:.2s ease;
}

.card button:hover{
  transform:translateY(-2px);
  filter:brightness(1.12);
}

.preview-btn{
  background:
    rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.08) !important;
}

.buy-btn{
  background:
    linear-gradient(
      135deg,
      #ff299f,
      #a33cff,
      #675cff
    );
  box-shadow:
    0 5px 18px rgba(190,50,255,.16);
}

.cart-add{
  background:
    linear-gradient(
      135deg,
      #00c9ff,
      #1478ff
    );
  box-shadow:
    0 5px 18px rgba(0,150,255,.14);
}

/* MODALS */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(3,3,7,.91);
  z-index:1300;
  justify-content:center;
  align-items:center;
  padding:20px;
  backdrop-filter:blur(9px);
}

.modal-content{
  position:relative;
  max-width:95vw;
  max-height:95vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal img{
  width:min(92vw,520px);
  height:min(78vh,700px);
  aspect-ratio:3/4;
  object-fit:contain;
  border-radius:14px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.65),
    0 0 45px rgba(180,70,255,.12);
}

.close{
  position:absolute;
  top:-15px;
  right:-15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.1);
  background:#fff;
  color:#000;
  font-size:22px;
  cursor:pointer;
  z-index:2;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}

/* ORDER FORM */
.form-modal{
  background:
    linear-gradient(
      145deg,
      rgba(31,31,44,.98),
      rgba(13,13,20,.98)
    );
  width:min(94vw,450px);
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;
  padding:24px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.65),
    0 0 45px rgba(160,60,255,.10);
}

.form-modal h2{
  margin-bottom:18px;
  font-size:24px;
  background:linear-gradient(90deg,#fff,#c9a7ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.form-modal input,
.form-modal textarea{
  width:100%;
  margin-bottom:11px;
  padding:13px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(5,5,10,.72);
  color:#fff;
  outline:none;
  transition:.2s;
}

.form-modal input:focus,
.form-modal textarea:focus{
  border-color:rgba(170,80,255,.65);
  box-shadow:0 0 18px rgba(150,60,255,.10);
}

.form-modal textarea{
  resize:none;
  min-height:80px;
}

.form-modal button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:11px;
  background:linear-gradient(135deg,#25d366,#0ca678);
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 7px 22px rgba(20,210,100,.13);
}

.form-modal button:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

/* CART PANEL */
.cart-panel{
  position:fixed;
  right:-100%;
  top:0;
  width:min(90vw,400px);
  height:100vh;
  background:
    linear-gradient(
      145deg,
      rgba(24,24,35,.99),
      rgba(10,10,16,.99)
    );
  z-index:1200;
  padding:24px;
  transition:.3s ease;
  box-shadow:
    -20px 0 70px rgba(0,0,0,.6),
    -5px 0 25px rgba(150,60,255,.07);
  overflow-y:auto;
  border-left:1px solid rgba(255,255,255,.08);
}

.cart-panel.open{
  right:0;
}

.cart-panel h2{
  margin-bottom:18px;
  font-size:24px;
  background:linear-gradient(90deg,#fff,#bda0ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.cart-item img{
  width:60px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  box-shadow:0 5px 18px rgba(0,0,0,.3);
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  font-size:14px;
  margin-bottom:5px;
}

.cart-item-info p{
  color:#32dcff;
  font-size:13px;
  font-weight:bold;
}

.remove-btn{
  background:rgba(255,255,255,.07);
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  padding:5px 8px;
  border-radius:7px;
  cursor:pointer;
  height:max-content;
}

.remove-btn:hover{
  background:rgba(255,60,100,.16);
}

.cart-total{
  margin-top:22px;
  font-size:19px;
  font-weight:800;
}

.cart-order{
  margin-top:15px;
  width:100%;
  padding:13px;
  border:none;
  border-radius:11px;
  background:linear-gradient(135deg,#25d366,#0ca678);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 22px rgba(20,210,100,.13);
  transition:.2s;
}

.cart-order:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.empty-cart{
  color:#858592;
  text-align:center;
  margin-top:50px;
}

/* MOBILE */
@media(max-width:700px){

  header{
    padding:26px 14px 24px;
  }

  .logo{
    font-size:28px;
    letter-spacing:2.5px;
  }

  .tagline{
    font-size:13px;
  }

  nav{
    gap:8px;
    margin-top:19px;
  }

  nav button{
    padding:9px 14px;
    font-size:13px;
  }

  .cart-btn{
    margin-top:16px;
    padding:10px 19px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    padding:0 12px;
    margin-top:28px;
  }

  .card{
    padding:8px;
    border-radius:14px;
  }

  .poster{
    border-radius:10px;
  }

  .card h3{
    font-size:13px;
    margin-top:9px;
    line-height:1.25;
  }

  .price{
    font-size:13px;
    margin-bottom:7px;
  }

  .card-buttons{
    flex-direction:column;
    gap:5px;
  }

  .card button{
    padding:8px 4px;
    font-size:11px;
    border-radius:8px;
  }

  .modal{
    padding:10px;
  }

  .modal img{
    width:92vw;
    height:82vh;
    max-height:82vh;
  }

  .close{
    top:-5px;
    right:-5px;
  }

  .form-modal{
    padding:21px;
  }

  .cart-panel{
    width:min(92vw,400px);
  }
}
    </style>
</head>

<body>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal" onclick="closePreview(event)">

    <button class="close" onclick="closePreview()">×</button>

<!-- ORDER MODAL -->
<div class="modal" id="orderModal">
  <div class="form-modal">
    <button class="close" onclick="closeOrder()">×</button>
    <h2>Order Poster</h2>

    <input type="text" id="customerName" placeholder="Your Name">
    <input type="text" id="customerPhone" placeholder="Phone Number">
    <textarea id="customerAddress" placeholder="Delivery Address"></textarea>

    <button onclick="sendOrder()">Order on WhatsApp</button>
  </div>
</div>

<!-- CART -->
<div class="cart-panel" id="cartPanel">
  <button class="close" onclick="toggleCart()">×</button>
  <h2>Your Cart 🛒</h2>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total: ₹<span id="cartTotal">0</span>
  </div>

  <button class="cart-order" onclick="orderCart()">Order Cart on WhatsApp</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("postersblr_cart")) || [];
let currentProduct = null;

function saveCart(){
  localStorage.setItem("postersblr_cart",JSON.stringify(cart));
  updateCart();
}

function updateCart(){
  document.getElementById("cartCount").textContent=cart.length;

  const items=document.getElementById("cartItems");
  const total=document.getElementById("cartTotal");

  if(cart.length===0){
    items.innerHTML='<div class="empty-cart">Your cart is empty.</div>';
    total.textContent="0";
    return;
  }

  let sum=0;

  items.innerHTML=cart.map((item,index)=>{
    sum+=Number(item.price);

    return `
      <div class="cart-item">
        <img src="${item.image}" alt="">
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <p>₹${item.price}</p>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
      </div>
    `;
  }).join("");

  total.textContent=sum;
}

function addToCart(card){
  cart.push({
    name:card.dataset.name,
    price:Number(card.dataset.price),
    image:card.dataset.image
  });

  saveCart();
}

function addOnlyToCart(card){
  addToCart(card);
}

function removeFromCart(index){
  cart.splice(index,1);
  saveCart();
}

function toggleCart(){
  document.getElementById("cartPanel").classList.toggle("open");
}

function previewPoster(src){
  document.getElementById("previewImage").src=src;
  document.getElementById("previewModal").style.display="flex";
}

function closePreview(event){
  if(!event || event.target.id==="previewModal"){
    document.getElementById("previewModal").style.display="none";
  }
}
    function filterProducts(category,button){
  document.querySelectorAll("nav button").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  document.querySelectorAll(".card").forEach(card=>{
    if(category==="all" || card.dataset.category===category){
      card.style.display="block";
    }else{
      card.style.display="none";
    }
  });
}

function buyNow(card){
  currentProduct={
    name:card.dataset.name,
    price:Number(card.dataset.price),
    image:card.dataset.image
  };

  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("customerAddress").value="";

function orderCart(){
  if(cart.length===0){
    alert("Your cart is empty.");
    return;

  document.getElementById("cartPanel").classList.remove("open");

  // Then open the order form

document.getElementById("orderModal").addEventListener("click",function(e){
  if(e.target===this){
    closeOrder();
  }
});

function sendOrder(){
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){
    alert("Please fill in all details.");
    return;
  }

  let message="Hello PostersBlr! 👋\n\nI want to order:\n\n";

  if(currentProduct){
    message+=
      `Poster: ${currentProduct.name}\n`+
      `Price: ₹${currentProduct.price}\n`;
  }else{
    cart.forEach((item,index)=>{
      message+=
        `${index+1}. ${item.name} - ₹${item.price}\n`;
    });

    const total=cart.reduce((sum,item)=>sum+Number(item.price),0);
    message+=`\nTotal: ₹${total}\n`;
  }

  message+=
    `\nName: ${name}`+
    `\nPhone: ${phone}`+
    `\nAddress: ${address}`;

  const whatsappURL=
    "https://wa.me/916366788554?text="+encodeURIComponent(message);

  window.open(whatsappURL,"_blank");
}
